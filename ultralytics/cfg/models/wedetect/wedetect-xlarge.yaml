# WeDetect-xlarge open-vocabulary detection model with ConvNeXt-XL + XLM-RoBERTa-large
# Model docs: https://github.com/WeDetect/WeDetectPT
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
model_size: xlarge # model size identifier

# Architecture
backbone:
  depths: [3, 3, 27, 3] # ConvNeXt stage depths
  dims: [256, 512, 1024, 2048] # ConvNeXt stage widths (C2/P2, C3/P3, C4/P4, C5/P5)
neck:
  scale_factor: 1.5 # CSPRepBiFPAN channel scaling factor
head:
  embed: 768 # text embedding dim (must match text_model output)

# Text encoder
text_model: "xlm-roberta:large" # text encoder variant