# RF-DETR training defaults mapped onto Ultralytics ``default.yaml`` field names.
# Sources: rfdetr.config.TrainConfig / SegmentationTrainConfig / KeypointTrainConfig,
#          rfdetr.models._defaults.MODEL_DEFAULTS, rfdetr.datasets.aug_configs.AUG_CONFIG.
# For documentation see https://docs.ultralytics.com/usage/cfg
# Pass explicitly: model.train(cfg="default-rfdetr.yaml", ...) — RFDETRTrainer uses this file by default.

task: detect # (str) YOLO task, i.e. detect, segment, semantic, classify, pose, obb
mode: train # (str) YOLO mode, i.e. train, val, predict, export, track, benchmark

# Train settings -------------------------------------------------------------------------------------------------------
model: # (str, optional) path to model file, i.e. rfdetr-nano.pt or rfdetr.yaml
data: # (str, optional) path to data file, i.e. coco8.yaml
epochs: 100 # (int) TrainConfig.epochs
time: # (float, optional) max hours to train; overrides epochs if set
patience: 10 # (int) TrainConfig.early_stopping_patience (official early_stopping default is False)
batch: 4 # (int | float) TrainConfig.batch_size; with nbs=16 → accumulate=4 ≡ grad_accum_steps
imgsz: 560 # (int | list) RFDETRBaseConfig.resolution (override per scale, e.g. nano=384)
save: True # (bool) save train checkpoints and predict results
save_period: 10 # (int) TrainConfig.checkpoint_interval
cache: False # (bool | str) cache images in RAM (True/'ram') or on 'disk'; False disables
device: # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps', or -1/[-1,-1] to auto-select idle GPUs
workers: 2 # (int) TrainConfig.num_workers
project: # (str, optional) project name for results root
name: # (str, optional) experiment name; results in 'project/name'
exist_ok: False # (bool) overwrite existing 'project/name' if True
pretrained: True # (bool | str) use pretrained weights (bool) or load weights from path (str)
cls_remap: True # (bool) when fine-tuning across datasets, remap pretrained cls head rows by class-name match
optimizer: AdamW # (str) DETR recipe uses AdamW (not YOLO optimizer=auto)
verbose: True # (bool) print verbose logs during training/val
seed: 42 # (int) namespace default when TrainConfig.seed is None
deterministic: True # (bool) enable deterministic ops; reproducible but may be slower
single_cls: False # (bool) treat all classes as a single class
rect: False # (bool) rectangular batches for train; rectangular batching for val when mode='val'
cos_lr: False # (bool) TrainConfig.lr_scheduler default is step (not cosine)
close_mosaic: 0 # (int) RF-DETR has no mosaic; keep disabled
resume: False # (bool) resume training from last checkpoint in the run dir
amp: True # (bool) ModelConfig.amp
fraction: 1.0 # (float) fraction of training dataset to use (>0.0, 1.0 = all)
profile: False # (bool) profile ONNX/TensorRT speeds during training for loggers
freeze: # (int | list, optional) freeze first N layers (int) or specific layer indices (list)
multi_scale: 0.5 # (float) TrainConfig.multi_scale=True; Ultralytics float ≈ expanded scale range
compile: False # (bool | str) ModelConfig.compile default False

# Segmentation
overlap_mask: True # (bool) merge instance masks into one mask during training (segment only)
mask_ratio: 4 # (int) ModelConfig.mask_downsample_ratio

# Classification
dropout: 0.0 # (float) ModelDefaults.dropout (decoder); unused for RF-DETR classify path

# Val/Test settings ----------------------------------------------------------------------------------------------------
val: True # (bool) run validation/testing during training
split: val # (str) dataset split to evaluate: 'val', 'test' or 'train'
save_json: False # (bool) save results to COCO JSON (detect/segment/pose) or PNG masks (semantic) for external evaluation
conf: # (float, optional) confidence threshold; defaults: predict=0.25, val=0.001
iou: 0.7 # (float) IoU threshold used for NMS
max_det: 300 # (int) ModelConfig.num_select / TrainConfig.num_select
quantize: # (int|str, optional) precision: predict/val use 16/fp16 for FP16 or 32/fp32/None for FP32; export also supports 8/int8 and w8a8|w16a16|w8a16|w8a32; replaces deprecated half/int8 args
dnn: False # (bool) use OpenCV DNN for ONNX inference
plots: True # (bool) save plots and images during train/val
end2end: # (bool, optional) whether to use end2end head (YOLO26, YOLOv10) for predict/val/export

# Predict settings -----------------------------------------------------------------------------------------------------
source: # (str, optional) path/dir/URL/stream for images or videos; e.g. 'ultralytics/assets' or '0' for webcam
vid_stride: 1 # (int) read every Nth frame for video sources
stream_buffer: False # (bool) True buffers all frames; False keeps the most recent frame for low-latency streams
visualize: False # (bool) visualize model features (predict) or TP/FP/FN confusion (val)
augment: False # (bool) apply test-time augmentation during prediction
agnostic_nms: False # (bool) class-agnostic NMS
classes: # (int | list[int], optional) filter by class id(s), e.g. 0 or [0,2,3]
retina_masks: False # (bool) use high-resolution segmentation masks (segment)
embed: # (list[int], optional) return feature embeddings from given layer indices

# Visualize settings ---------------------------------------------------------------------------------------------------
show: False # (bool) show images/videos in a window if supported
save_frames: False # (bool) save individual frames from video predictions
save_txt: False # (bool) save results as .txt files (xywh format)
save_conf: False # (bool) save confidence scores with results
save_crop: False # (bool) save cropped prediction regions to files
show_labels: True # (bool) draw class labels on images, e.g. 'person'
show_conf: True # (bool) draw confidence values on images, e.g. '0.99'
show_boxes: True # (bool) draw bounding boxes on images
line_width: # (int, optional) line width of boxes; auto-scales with image size if not set

# Export settings ------------------------------------------------------------------------------------------------------
format: torchscript # (str) target format, e.g. torchscript|onnx|openvino|engine|coreml|saved_model|pb|edgetpu|paddle|mnn|ncnn|imx|rknn|executorch|axelera|deepx|qnn|litert
keras: False # (bool) TF SavedModel only (format=saved_model); enable Keras layers during export
optimize: False # (bool) DEEPX only; higher compiler optimization (slower compile, faster inference)
dynamic: False # (bool) dynamic shapes for torchscript, onnx, openvino, engine, coreml; enable variable image sizes
simplify: True # (bool) ONNX/engine only; run graph simplifier for cleaner ONNX before runtime conversion
opset: # (int, optional) ONNX/engine only; opset version for export; leave unset to use a tested default
workspace: # (float, optional) engine (TensorRT) only; workspace size in GiB, e.g. 4
nms: False # (bool) fuse NMS into exported model when backend supports; if True, conf/iou apply (agnostic_nms except coreml)

# Hyperparameters ------------------------------------------------------------------------------------------------------
lr0: 0.0001 # (float) TrainConfig.lr (encoder uses lr_encoder=1.5e-4 in official PTL; Ultralytics uses one LR)
lrf: 1.0 # (float) step schedule with lr_drop≈epochs → LR stays flat; final LR = lr0 * lrf
momentum: 0.9 # (float) AdamW beta1
weight_decay: 0.0001 # (float) TrainConfig.weight_decay
warmup_epochs: 0.0 # (float) TrainConfig.warmup_epochs
warmup_momentum: 0.8 # (float) unused when warmup_epochs=0
warmup_bias_lr: 0.0 # (float) AdamW: no elevated bias LR
distill_model: # (str, optional) path to teacher model for knowledge distillation
dis: 6.0 # (float) distillation loss weight (unused unless distill_model set)
box: 5.0 # (float) MODEL_DEFAULTS.bbox_loss_coef (giou kept at official 5:2 → 2.0); also mask_ce/dice for segment
cls: 1.0 # (float) TrainConfig.cls_loss_coef (KeypointTrainConfig uses 2.0 — override when training pose)
cls_pw: 0.0 # (float) class weights power for handling class imbalance (0.0=disable)
dfl: 0.0 # (float) unused for DETR (no DFL head)
pose: 1.0 # (float) KeypointTrainConfig.keypoint_l1_loss_coef
kobj: 1.0 # (float) KeypointTrainConfig keypoint_findable/visible_loss_coef
rle: 1.0 # (float) KeypointTrainConfig.keypoint_nll_loss_coef
angle: 0.0 # (float) unused for RF-DETR (no OBB head)
nbs: 16 # (int) TrainConfig.auto_batch_target_effective / batch*grad_accum (4*4)
hsv_h: 0.0 # (float) AUG_CONFIG has no color jitter by default
hsv_s: 0.0 # (float) AUG_CONFIG has no color jitter by default
hsv_v: 0.0 # (float) AUG_CONFIG has no color jitter by default
degrees: 0.0 # (float) AUG_CONFIG has no rotation by default
translate: 0.0 # (float) AUG_CONFIG has no translate by default
scale: 0.0 # (float | tuple) geometric scale left to multi_scale / letterbox; AUG_CONFIG has none
shear: 0.0 # (float) AUG_CONFIG has no shear by default
perspective: 0.0 # (float) AUG_CONFIG has no perspective by default
flipud: 0.0 # (float) VerticalFlip commented out in AUG_CONFIG
fliplr: 0.5 # (float) AUG_CONFIG HorizontalFlip p=0.5
bgr: 0.0 # (float) RGB↔BGR channel swap probability
mosaic: 0.0 # (float) RF-DETR does not use mosaic
mixup: 0.0 # (float) MixUp augmentation probability
cutmix: 0.0 # (float) CutMix augmentation probability
copy_paste: 0.0 # (float) segmentation copy-paste probability
copy_paste_mode: flip # (str) copy-paste strategy for segmentation: flip or mixup
auto_augment: randaugment # (str) classification auto augmentation policy (unused for RF-DETR)
erasing: 0.0 # (float) random erasing (classify only; unused)

# Custom config.yaml ---------------------------------------------------------------------------------------------------
cfg: # (str, optional) path to a config.yaml that overrides defaults

# Tracker settings ------------------------------------------------------------------------------------------------------
tracker: tracktrack.yaml # (str) tracker config: botsort.yaml, bytetrack.yaml, ocsort.yaml, deepocsort.yaml, fasttrack.yaml, tracktrack.yaml
