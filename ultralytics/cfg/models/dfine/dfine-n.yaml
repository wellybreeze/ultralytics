# D-FINE-N (HGNetv2-B0) — 2 FPN levels (P4/P5 only)
# Matches D-FINE configs/dfine/dfine_hgnetv2_n_coco.yml
# (return_idx [2,3], hd=128, expansion=0.34, depth_mult=0.5, nl=3, use_lab=True)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]  — HGNetv2-B0, return_idx [2,3] → P4/P5
  # HGStem/HGBlock last bool = use_lab (official N/S/M)
  - [-1, 1, HGStem, [16, 16, True]] # 0-P2/4
  - [-1, 3, HGBlock, [16, 64, 3, False, False, True]] # 1 stage1

  - [-1, 1, DWConv, [64, 3, 2, 1, False]] # 2-P3/8
  - [-1, 3, HGBlock, [32, 256, 3, False, False, True]] # 3 stage2

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 3, HGBlock, [64, 512, 5, True, False, True]] # 5
  - [-1, 3, HGBlock, [64, 512, 5, True, True, True]] # 6 stage3 (P4)

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 7-P5/32
  - [-1, 3, HGBlock, [128, 1024, 5, True, False, True]] # 8 stage4 (P5)

head:
  # HybridEncoder 2-level: hd=128, dim_ffn=512, expansion=0.34, depth_mult=0.5
  # Official: round(expansion * hidden_dim // 2) == round(0.34*128//2) == 21
  - [-1, 1, Conv, [128, 1, 1, None, 1, 1, False]] # 9 input_proj.1 (P5)
  - [-1, 1, AIFI, [512, 8]] # 10
  - [-1, 1, Conv, [128, 1, 1, None, 1, 1, False]] # 11 Y5, lateral

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [6, 1, Conv, [128, 1, 1, None, 1, 1, False]] # 13 input_proj.0 (P4)
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 1, DFINERepNCSPELAN4, [128, 256, 21, 2]] # 15 X4 / fpn_blocks.0

  - [-1, 1, DFINESCDown, [128, 3, 2]] # 16 downsample_convs.0
  - [[-1, 11], 1, Concat, [1]] # 17
  - [-1, 1, DFINERepNCSPELAN4, [128, 256, 21, 2]] # 18 F5 / pan_blocks.0

  # DFINEDecoder: hd=128, nl=3, dim_ffn=512; feat_strides [16,32], num_points [6,6]
  # args after ch-insert: nc, ch, hd, nq, n_heads, nl, dim_ffn, dropout, reg_max, reg_scale,
  #   eval_idx, nd, label_noise_ratio, box_noise_scale, num_points, activation,
  #   learn_query_content, eval_spatial_size, feat_strides
  - [
      [15, 18],
      1,
      DFINEDecoder,
      [nc, 128, 300, 8, 3, 512, 0.0, 32, 4.0, -1, 100, 0.5, 1.0, [6, 6], "relu", False, [640, 640], [16, 32]],
    ]
