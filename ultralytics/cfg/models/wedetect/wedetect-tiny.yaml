# WeDetect-tiny open-vocabulary detection model with ConvNeXt-T + XLM-RoBERTa-base
# Model docs: https://github.com/WeDetect/WeDetectPT
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
model_size: tiny # model size identifier

# Architecture
backbone:
  depths: [3, 3, 9, 3] # ConvNeXt stage depths
  dims: [96, 192, 384, 768] # ConvNeXt stage widths (C2/P2, C3/P3, C4/P4, C5/P5)
neck:
  scale_factor: 0.75 # CSPRepBiFPAN channel scaling factor
  num_repeats: [1, 6, 12, 18, 6, 6, 6, 6, 6] # block repeats per stage (tiny: reduced)
head:
  embed: 768 # text embedding dim (must match text_model output)

# Text encoder
text_model: "xlm-roberta:base" # text encoder variant
