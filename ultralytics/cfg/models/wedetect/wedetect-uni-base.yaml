# WeDetect-Uni-base unified detection model with learnable prompt embeddings
# No text encoder needed at inference — uses trained embeddings instead
# num_prompts and prompt_dim are overridden at training time based on dataset nc
# Model docs: https://github.com/WeDetect/WeDetectPT
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
model_size: base # model size identifier
prompt_dim: 768 # prompt embedding dimension

# Architecture
backbone:
  depths: [3, 3, 27, 3] # ConvNeXt stage depths
  dims: [128, 256, 512, 1024] # ConvNeXt stage widths (C2/P2, C3/P3, C4/P4, C5/P5)
neck:
  scale_factor: 1.0 # CSPRepBiFPAN channel scaling factor
head:
  embed: 768 # text embedding dim (must match prompt_dim)

# Text model used for generating initial prompt embeddings during training
text_model: "xlm-roberta:base" # text encoder variant (training only)
