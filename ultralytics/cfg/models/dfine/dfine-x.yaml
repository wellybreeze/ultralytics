# D-FINE-X (HGNetv2-B5) — official HybridEncoder + DFINEDecoder
# Matches D-FINE configs/define/dfine_hgnetv2_x_coco.yml (hd=384, dim_ffn=2048, reg_scale=8)

# Parameters
nc: 80 # number of classes
freeze_norm: true # official HGNetv2.freeze_norm (FrozenBatchNorm2d in backbone)
scales:
  # [depth, width, max_channels]
  x: [1.00, 1.00, 2048]

backbone:
  # [from, repeats, module, args]  — HGNetv2-B5, return_idx [1,2,3]
  - [-1, 1, HGStem, [32, 64]] # 0-P2/4
  - [-1, 6, HGBlock, [64, 128, 3]] # 1 stage1

  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 2-P3/8
  - [-1, 6, HGBlock, [128, 512, 3]] # 3
  - [-1, 6, HGBlock, [128, 512, 3, False, True]] # 4 stage2 (P3)

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 5-P4/16
  - [-1, 6, HGBlock, [256, 1024, 5, True, False]] # 6
  - [-1, 6, HGBlock, [256, 1024, 5, True, True]] # 7
  - [-1, 6, HGBlock, [256, 1024, 5, True, True]] # 8
  - [-1, 6, HGBlock, [256, 1024, 5, True, True]] # 9
  - [-1, 6, HGBlock, [256, 1024, 5, True, True]] # 10 stage3 (P4)

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 11-P5/32
  - [-1, 6, HGBlock, [512, 2048, 5, True, False]] # 12
  - [-1, 6, HGBlock, [512, 2048, 5, True, True]] # 13 stage4 (P5)

head:
  # HybridEncoder: hd=384, dim_ffn=2048, expansion=1.0, depth_mult=1.0
  # RepNCSPELAN4 → [384, 768, 192, 3]
  - [-1, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 14 input_proj.2
  - [-1, 1, AIFI, [2048, 8]] # 15
  - [-1, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 16 Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [10, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 18 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 19
  - [-1, 1, DFINERepNCSPELAN4, [384, 768, 192, 3]] # 20 fpn_blocks.0
  - [-1, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 21 Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22
  - [4, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 23 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 24
  - [-1, 1, DFINERepNCSPELAN4, [384, 768, 192, 3]] # 25 X3

  - [-1, 1, DFINESCDown, [384, 3, 2]] # 26
  - [[-1, 21], 1, Concat, [1]] # 27
  - [-1, 1, DFINERepNCSPELAN4, [384, 768, 192, 3]] # 28 F4

  - [-1, 1, DFINESCDown, [384, 3, 2]] # 29
  - [[-1, 16], 1, Concat, [1]] # 30
  - [-1, 1, DFINERepNCSPELAN4, [384, 768, 192, 3]] # 31 F5

  # DFINEDecoder: encoder neck is 384-ch, but official DFINETransformer keeps hidden_dim=256
  # (input_proj 384→256). reg_scale=8, nl=6, dim_ffn=1024 (default from include/dfine_hgnetv2.yml)
  - [[25, 28, 31], 1, DFINEDecoder, [nc, 256, 300, 8, 6, 1024, 0.0, 32, 8.0]]
