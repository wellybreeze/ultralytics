# Ultralytics RF-DETR object detection models with DINOv2 backbone
# Model docs: https://docs.ultralytics.com/models/rfdetr
# Task docs: https://docs.ultralytics.com/tasks/detect
# Note: imgsz comes from default.yaml / CLI / RFDETR(..., imgsz=...); not from this file.

# Parameters
nc: 90 # number of classes
scales: # size variants, i.e. 'model=rfdetr-nano.yaml' loads this file with scale 'nano'
  nano: [] # RFDETRNanoConfig — recommended imgsz=384 (must be ÷32 = patch×windows)
  small: [] # RFDETRSmallConfig — recommended imgsz=512 (÷32)
  medium: [] # RFDETRMediumConfig — recommended imgsz=576 (÷32)
  large: [] # RFDETRLargeConfig — recommended imgsz=704 (÷32)
