# Ultralytics RF-DETR instance segmentation models with DINOv2 backbone
# Model docs: https://docs.ultralytics.com/models/rfdetr
# Task docs: https://docs.ultralytics.com/tasks/segment
# Note: imgsz comes from default.yaml / CLI / RFDETR(..., imgsz=...); not from this file.

# Parameters
nc: 90 # number of classes
scales: # size variants, i.e. 'model=rfdetr-seg-nano.yaml' loads this file with scale 'nano'
  nano: [] # RFDETRSegNanoConfig — recommended imgsz=312 (must be ÷12)
  small: [] # RFDETRSegSmallConfig — recommended imgsz=384 (÷24)
  medium: [] # RFDETRSegMediumConfig — recommended imgsz=432 (÷24)
  large: [] # RFDETRSegLargeConfig — recommended imgsz=504 (÷24)
  xlarge: [] # RFDETRSegXLargeConfig — recommended imgsz=624 (÷24)
  2xlarge: [] # RFDETRSeg2XLargeConfig — recommended imgsz=768 (÷24)