# D-FINE-S (HGNetv2-B0) — official HybridEncoder + DFINEDecoder
# Matches D-FINE configs/define/dfine_hgnetv2_s_coco.yml
# (expansion=0.5, depth_mult=0.34, in_ch [256,512,1024], nl=3, use_lab=True)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  s: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]  — HGNetv2-B0, return_idx [1,2,3]
  - [-1, 1, HGStem, [16, 16, True]] # 0-P2/4
  - [-1, 3, HGBlock, [16, 64, 3, False, False, True]] # 1 stage1

  - [-1, 1, DWConv, [64, 3, 2, 1, False]] # 2-P3/8
  - [-1, 3, HGBlock, [32, 256, 3, False, False, True]] # 3 stage2 (P3)

  - [-1, 1, DWConv, [256, 3, 2, 1, False]] # 4-P4/16
  - [-1, 3, HGBlock, [64, 512, 5, True, False, True]] # 5
  - [-1, 3, HGBlock, [64, 512, 5, True, True, True]] # 6 stage3 (P4)

  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 7-P5/32
  - [-1, 3, HGBlock, [128, 1024, 5, True, False, True]] # 8 stage4 (P5)

head:
  # HybridEncoder: hd=256, expansion=0.5, depth_mult=0.34 → c4=64, n=round(3*0.34)=1
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 11 Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 1, DFINERepNCSPELAN4, [256, 512, 64, 1]] # 15 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16 Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 19
  - [-1, 1, DFINERepNCSPELAN4, [256, 512, 64, 1]] # 20 X3

  - [-1, 1, DFINESCDown, [256, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]] # 22
  - [-1, 1, DFINERepNCSPELAN4, [256, 512, 64, 1]] # 23 F4

  - [-1, 1, DFINESCDown, [256, 3, 2]] # 24
  - [[-1, 11], 1, Concat, [1]] # 25
  - [-1, 1, DFINERepNCSPELAN4, [256, 512, 64, 1]] # 26 F5

  # DFINEDecoder: hd=256, nl=3
  - [[20, 23, 26], 1, DFINEDecoder, [nc, 256, 300, 8, 3]]
